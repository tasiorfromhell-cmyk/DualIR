name: Windows x64 VST3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: VS2022 x64 Release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Select Visual Studio 2022 and v143 tools
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'vswhere is missing on the Windows runner.'
          }
          $query = @('-latest', '-products', '*', '-version', '[17.0,18.0)',
                     '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                     '-property', 'installationPath')
          $vs = & $vswhere @query
          if ([string]::IsNullOrWhiteSpace($vs)) {
            # windows-latest changes over time. Install VS2022 if the image no longer includes it.
            $installer = Join-Path $env:RUNNER_TEMP 'vs2022-buildtools.exe'
            Invoke-WebRequest 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') {
              throw 'Visual Studio installer signature validation failed.'
            }
            $installPath = Join-Path $env:RUNNER_TEMP 'VS2022-BuildTools'
            $arguments = @('--quiet', '--wait', '--norestart', '--nocache',
                           '--installPath', "`"$installPath`"", '--add',
                           'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "VS2022 installation failed with exit code $($process.ExitCode)."
            }
            $vs = & $vswhere @query
          }
          if ([string]::IsNullOrWhiteSpace($vs)) {
            throw 'Visual Studio 2022 with the v143 x64 C++ tools was not found.'
          }
          "VS2022_INSTANCE=$($vs.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Visual Studio 2022: $vs"

      - name: Configure Visual Studio 2022 x64
        run: cmake --preset windows-vs2022 -T v143 "-DCMAKE_GENERATOR_INSTANCE=$env:VS2022_INSTANCE"

      - name: Build Release VST3 and tests
        run: cmake --build --preset windows-release --parallel 2

      - name: Test Windows Release and native VST3
        run: ctest --preset windows-release

      - name: Verify Windows x64 binary and package whole VST3 bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build/windows-vs2022/DualIR_artefacts/Release/VST3/DualIR.vst3'
          $relativeBinary = 'Contents/x86_64-win/DualIR.vst3'
          $binary = Join-Path $bundle $relativeBinary
          if (-not (Test-Path -LiteralPath $bundle -PathType Container) -or
              -not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "The Windows VST3 bundle or binary is missing: $binary"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'DualIR.vst3 is not a Windows PE binary.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
              [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or
              [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'DualIR.vst3 is not a valid AMD64 Windows binary.'
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dist/DualIR-Windows-x64-VST3.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $bundle, $zipPath, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $expected = "DualIR.vst3/$relativeBinary"
            $paths = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if ($expected -notin $paths) { throw "ZIP does not contain $expected" }
            $bundleFiles = @(Get-ChildItem -LiteralPath $bundle -Recurse -Force -File)
            $zipFiles = @($zip.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
            if ($bundleFiles.Count -ne $zipFiles.Count) { throw 'ZIP omitted files from the VST3 bundle.' }
          } finally { $zip.Dispose() }
          Write-Host "Windows bundle: $bundle"
          Write-Host "Artifact ZIP: $zipPath"
          Get-FileHash -LiteralPath $zipPath -Algorithm SHA256

      - name: Upload Windows VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DualIR-Windows-x64-VST3
          path: dist/DualIR-Windows-x64-VST3.zip
          if-no-files-found: error
          compression-level: 0

      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DualIR-Windows-failure-logs
          path: |
            build/windows-vs2022/Testing/Temporary/*.log
            build/windows-vs2022/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
