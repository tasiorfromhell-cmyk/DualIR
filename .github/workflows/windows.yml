name: Windows x64 VST3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: VS2022 x64 Release
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate version and tag
        id: version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'VERSION must use MAJOR.MINOR.PATCH without leading zeros.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and VERSION do not match.'
          }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## v$version" -Quiet)) {
            throw 'Version is missing from CHANGELOG.md.'
          }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $versionTags = @(git tag --list "v$version")
            if ($versionTags.Count -gt 0) {
              $tagCommit = git rev-parse "refs/tags/v$version^{commit}"
              if ($tagCommit.Trim() -ne $env:GITHUB_SHA) {
                throw 'This version already has a tag. Bump VERSION and update CHANGELOG for the new change.'
              }
            }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Select Visual Studio 2022 and v143 tools
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'vswhere is missing on the Windows runner.'
          }
          $query = @('-latest', '-products', '*', '-version', '[17.0,18.0)',
                     '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                     '-property', 'installationPath')
          $vs = & $vswhere @query
          if ([string]::IsNullOrWhiteSpace($vs)) {
            # windows-latest changes over time. Install VS2022 if the image no longer includes it.
            $installer = Join-Path $env:RUNNER_TEMP 'vs2022-buildtools.exe'
            Invoke-WebRequest 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') {
              throw 'Visual Studio installer signature validation failed.'
            }
            $installPath = Join-Path $env:RUNNER_TEMP 'VS2022-BuildTools'
            $arguments = @('--quiet', '--wait', '--norestart', '--nocache',
                           '--installPath', "`"$installPath`"", '--add',
                           'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "VS2022 installation failed with exit code $($process.ExitCode)."
            }
            $vs = & $vswhere @query
          }
          if ([string]::IsNullOrWhiteSpace($vs)) {
            throw 'Visual Studio 2022 with the v143 x64 C++ tools was not found.'
          }
          "VS2022_INSTANCE=$($vs.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Visual Studio 2022: $vs"

      - name: Configure Visual Studio 2022 x64
        run: cmake --preset windows-vs2022 -T v143 "-DCMAKE_GENERATOR_INSTANCE=$env:VS2022_INSTANCE"

      - name: Build Release VST3 and tests
        run: cmake --build --preset windows-release --parallel 2

      - name: Test Windows Release and native VST3
        run: ctest --preset windows-release

      - name: Verify Windows x64 binary and package whole VST3 bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build/windows-vs2022/DualIR_artefacts/Release/VST3/RottingIR.vst3'
          $relativeBinary = 'Contents/x86_64-win/RottingIR.vst3'
          $binary = Join-Path $bundle $relativeBinary
          if (-not (Test-Path -LiteralPath $bundle -PathType Container) -or
              -not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "The Windows VST3 bundle or binary is missing: $binary"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'RottingIR.vst3 is not a Windows PE binary.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
              [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or
              [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'RottingIR.vst3 is not a valid AMD64 Windows binary.'
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist/RottingIR-v${{ steps.version.outputs.value }}-Windows-x64.zip"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $bundle, $zipPath, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $expected = "RottingIR.vst3/$relativeBinary"
            $paths = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if ($expected -notin $paths) { throw "ZIP does not contain $expected" }
            $bundleFiles = @(Get-ChildItem -LiteralPath $bundle -Recurse -Force -File)
            $zipFiles = @($zip.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
            if ($bundleFiles.Count -ne $zipFiles.Count) { throw 'ZIP omitted files from the VST3 bundle.' }
          } finally { $zip.Dispose() }
          Write-Host "Windows bundle: $bundle"
          Write-Host "Artifact ZIP: $zipPath"
          Get-FileHash -LiteralPath $zipPath -Algorithm SHA256

      - name: Upload Windows VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RottingIR-v${{ steps.version.outputs.value }}-Windows-x64
          path: dist/RottingIR-v${{ steps.version.outputs.value }}-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish new immutable version after successful build and tests
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $repo = $env:GITHUB_REPOSITORY
          $existing = gh release list --repo $repo --limit 1000 --json tagName --jq ".[].tagName"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if ($tag -in $existing) {
            Write-Host "Release $tag already exists; preserving it and all its assets."
            exit 0
          }
          git fetch origin --tags
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tags.' }
          $tagCommit = git rev-parse --verify "refs/tags/$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($tagCommit.Trim() -ne $env:GITHUB_SHA) { throw 'Existing tag points to another commit.' }
          } else {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create version tag; nothing published.' }
          }
          $log = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($log, "(?ms)^## $([regex]::Escape($tag))\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw 'Release notes not found.' }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $section.Groups[1].Value.Trim() | Set-Content -Path $notes -Encoding utf8
          gh release create $tag --repo $repo --verify-tag --draft --title "RottingIR $tag" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release upload $tag "dist/RottingIR-$tag-Windows-x64.zip" --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains draft.' }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; release remains draft.' }

      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RottingIR-Windows-failure-logs
          path: |
            build/windows-vs2022/Testing/Temporary/*.log
            build/windows-vs2022/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
